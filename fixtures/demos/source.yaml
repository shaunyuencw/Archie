  - prompt: Rename Access event service to Building event viewer
    provider: live after natural-language document extraction
    expected: Rename the application only; keep all door hardware in Client.
  - prompt: Use push delivery from Door controllers to Access event service over HTTPS TCP 443, initiated by
      each controller. Keep remote unlock out of scope.
    provider: live
    expected: Resolve delivery, protocol, port and initiator with prompt evidence; do not add control functionality.
  - prompt: Add a separate audit service in Z2 and connect Access event service to it. Leave the audit transport
      undecided.
    provider: live
    expected: New protected audit component and unresolved interface; no invented protocol or port.
